[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-conversation-cleanup"
dynamic = ["version"]
description = "Portable reconciliation utility for ChatGPT Desktop leftovers and archived Codex deletion."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "LJY0317"}]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]

[project.scripts]
chatgpt-cleanup = "chatgpt_cleanup.__main__:entrypoint"

[tool.setuptools.dynamic]
version = {attr = "chatgpt_cleanup.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
