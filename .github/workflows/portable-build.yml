name: Portable build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: portable-macOS
            artifact_path: "dist/ChatGPT Conversation Cleanup.app.zip*"
          - os: windows-latest
            artifact_name: portable-Windows
            artifact_path: "dist/ChatGPT Conversation Cleanup.exe*"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Build portable executable
        run: python scripts/build-portable.py
      - name: Upload unsigned test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
